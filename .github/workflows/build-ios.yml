name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MyFinance/**'
      - 'MyFinanceTests/**'
      - 'MyFinance.xcodeproj/**'
      - 'Package.swift'
      - 'scripts/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'MyFinance/**'
      - 'MyFinanceTests/**'
      - 'MyFinance.xcodeproj/**'
      - 'Package.swift'
      - 'scripts/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

concurrency:
  group: unsigned-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build MyFinance
    runs-on: macos-15-intel
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure temporary build paths
        run: |
          python3 - <<'PYTHON'
          import os, pathlib
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          names = {'DERIVED_DATA': 'MyFinanceDerivedData', 'SIMULATOR_DATA': 'MyFinanceSimulatorData',
                   'OUTPUT_DIR': 'MyFinanceArtifacts', 'TEST_RESULTS': 'MyFinanceTests.xcresult'}
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              for name, path in names.items():
                  environment.write(name + '=' + str(temporary / path) + '\n')
          (temporary / 'MyFinanceArtifacts').mkdir(exist_ok=True)
          PYTHON

      - name: Show Apple build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Validate source and Xcode project
        run: |
          set -euo pipefail
          python3 scripts/static-checks.py
          python3 scripts/test-package-ipa.py
          xcodebuild -list -project MyFinance.xcodeproj

      - name: Run core XCTest suite
        run: swift test

      - name: Select available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-simulators.json"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'available-simulators.json'
          devices = json.loads(path.read_text())['devices']
          iphones = [device for runtime, group in devices.items() if '.iOS-' in runtime
                     for device in group if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No available iPhone simulator. Check the macOS runner image.')
          device = sorted(iphones, key=lambda item: item['name'])[-1]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('IPHONE_SIMULATOR=' + device['udid'] + '\n')
          print('Selected simulator:', device['name'])
          PY

      - name: Run native app and SwiftData tests
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          xcodebuild test \
            -project MyFinance.xcodeproj \
            -scheme MyFinance \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            -derivedDataPath "$SIMULATOR_DATA" \
            -resultBundlePath "$TEST_RESULTS" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$OUTPUT_DIR/simulator-tests.log"

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MyFinance.xcodeproj \
            -scheme MyFinance \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$OUTPUT_DIR/device-build.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          python3 scripts/package-ipa.py \
            "$DERIVED_DATA/Build/Products/Release-iphoneos/MyFinance.app" \
            "$OUTPUT_DIR/MyFinance-unsigned.ipa"
          shasum -a 256 "$OUTPUT_DIR/MyFinance-unsigned.ipa" > "$OUTPUT_DIR/MyFinance-unsigned.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MyFinance-unsigned-IPA-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/MyFinanceArtifacts/MyFinance-unsigned.ipa
            ${{ runner.temp }}/MyFinanceArtifacts/MyFinance-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MyFinance-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/MyFinanceArtifacts/*.log
            ${{ runner.temp }}/MyFinanceTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain the download
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## MyFinance unsigned iPhone build
          Download **MyFinance-unsigned-IPA** from this run's Artifacts section and extract the ZIP.
          The package contains `MyFinance-unsigned.ipa` and its SHA-256 checksum.

          This is an unsigned native iOS device build. It must be signed before installation;
          downloading it on an iPhone does not install it. No Apple Account, certificate,
          provisioning profile or signing secret was used in this workflow.

          The optional widget extension is not embedded. This workflow does not publish a release.
          SUMMARY
